# Si el navegador pide una página (F5 en /alumnos), se sirve React y no la API
map $http_accept $es_pagina {
    default 0;
    "~text/html" 1;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Peticiones a la API: van al contenedor del backend (servicio "app" del docker-compose)
    location ~ ^/(usuarios|alumnos|materias|inscripciones|carreras)(/|$) {
        if ($es_pagina) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # index.html nunca se guarda en caché: si no, después de un F5 en /alumnos el navegador
    # podría devolver ese HTML cuando el código le pide los datos a la API (misma dirección)
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Rutas de React (/login, /carrera/2, /alumno/5, etc.): siempre se devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
